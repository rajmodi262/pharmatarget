[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["data", "web", "notebooks", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends/Query in defaults is the framework idiom
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
